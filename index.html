<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Secret Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen">

    <!-- Header -->
    <header class="py-12 text-center">
        <h1 class="text-5xl font-bold text-amber-400 font-serif mb-4">The Curated Collection</h1>
        <p class="text-slate-400 text-lg">Click any book to open</p>
    </header>

    <!-- Books Grid -->
    <main class="container mx-auto px-4 pb-20">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-5xl mx-auto">
            
            <!-- Book 1: Red -->
            <div onclick="openBook(0)" class="cursor-pointer bg-gradient-to-br from-red-700 to-red-900 h-64 rounded-lg flex flex-col items-center justify-center border-2 border-red-600 hover:brightness-110 transition-all">
                <span class="text-5xl mb-2">📕</span>
                <h2 class="text-xl font-bold text-red-100">Volume I</h2>
                <p class="text-red-200 text-xs mt-1">Click to open</p>
            </div>

            <!-- Book 2: Blue -->
            <div onclick="openBook(1)" class="cursor-pointer bg-gradient-to-br from-blue-600 to-blue-900 h-64 rounded-lg flex flex-col items-center justify-center border-2 border-blue-600 hover:brightness-110 transition-all">
                <span class="text-5xl mb-2">📘</span>
                <h2 class="text-xl font-bold text-blue-100">Volume II</h2>
                <p class="text-blue-200 text-xs mt-1">Click to open</p>
            </div>

            <!-- Book 3: Green -->
            <div onclick="openBook(2)" class="cursor-pointer bg-gradient-to-br from-emerald-600 to-emerald-900 h-64 rounded-lg flex flex-col items-center justify-center border-2 border-emerald-600 hover:brightness-110 transition-all">
                <span class="text-5xl mb-2">📗</span>
                <h2 class="text-xl font-bold text-emerald-100">Volume III</h2>
                <p class="text-emerald-200 text-xs mt-1">Click to open</p>
            </div>

            <!-- Book 4: Purple -->
            <div onclick="openBook(3)" class="cursor-pointer bg-gradient-to-br from-purple-600 to-purple-900 h-64 rounded-lg flex flex-col items-center justify-center border-2 border-purple-600 hover:brightness-110 transition-all">
                <span class="text-5xl mb-2">📓</span>
                <h2 class="text-xl font-bold text-purple-100">Volume IV</h2>
                <p class="text-purple-200 text-xs mt-1">Click to open</p>
            </div>

            <!-- Book 5: Orange -->
            <div onclick="openBook(4)" class="cursor-pointer bg-gradient-to-br from-orange-500 to-orange-800 h-64 rounded-lg flex flex-col items-center justify-center border-2 border-orange-600 hover:brightness-110 transition-all">
                <span class="text-5xl mb-2">📙</span>
                <h2 class="text-xl font-bold text-orange-100">Volume V</h2>
                <p class="text-orange-200 text-xs mt-1">Click to open</p>
            </div>

            <!-- Book 6: Teal -->
            <div onclick="openBook(5)" class="cursor-pointer bg-gradient-to-br from-teal-600 to-teal-900 h-64 rounded-lg flex flex-col items-center justify-center border-2 border-teal-600 hover:brightness-110 transition-all">
                <span class="text-5xl mb-2">📚</span>
                <h2 class="text-xl font-bold text-teal-100">Volume VI</h2>
                <p class="text-teal-200 text-xs mt-1">Click to open</p>
            </div>

        </div>
    </main>

    <!-- SIMPLE MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/90 hidden z-50 overflow-y-auto">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div id="modalContent" class="bg-slate-800 max-w-2xl w-full rounded-xl p-8 relative">
                <!-- Close Button -->
                <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-2xl hover:text-red-400">&times;</button>
                
                <!-- Content -->
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <script>
        const booksData = [
            {
                color: "bg-red-900",
                content: `
                    <div class="text-red-100 text-center">
                        <i class="fas fa-heart text-4xl text-red-500 mb-4"></i>
                        <h2 class="text-2xl font-bold mb-4 text-red-200">A Whisper of Honey</h2>
                        <p class="text-lg italic">"In the quiet corners of the world, where sunlight dances through dust motes, I find myself thinking of you. You are the first sip of coffee on a rainy morning, the warmth of a blanket fresh from the dryer. Life isn't just about the grand gestures, but about these small, sweet moments that feel like home."</p>
                    </div>
                `
            },
            {
                color: "bg-blue-900",
                content: `
                    <div class="text-blue-100 text-center">
                        <div class="text-5xl mb-4">💝</div>
                        <h2 class="text-2xl font-bold mb-4 text-blue-200">A Token for You</h2>
                        <div class="bg-slate-700 p-4 rounded-lg max-w-sm mx-auto mb-4">
                            <div class="text-xs uppercase text-blue-300">Gift Certificate</div>
                            <div class="text-xl font-bold text-white">One Free Hug</div>
                            <div class="text-sm text-slate-300">Redeemable anytime</div>
                        </div>
                        <div class="text-3xl">😍 🥰 💖 💕 ❤️</div>
                    </div>
                `
            },
            {
                color: "bg-emerald-900",
                content: `
                    <div class="text-emerald-100 text-center">
                        <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=300&h=300&fit=crop" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-emerald-600">
                        <h2 class="text-2xl font-bold mb-2 text-emerald-200">Strength & Memory</h2>
                        <p class="mb-4">Like the elephant, my love for you never forgets.</p>
                        <div class="bg-emerald-800 p-3 rounded inline-block">
                            <p class="font-handwriting text-xl">"I Love You"</p>
                        </div>
                    </div>
                `
            },
            {
                color: "bg-purple-900",
                content: `
                    <div class="text-purple-100">
                        <h2 class="text-2xl font-bold mb-4 text-purple-200 text-center">The Unabridged Journey</h2>
                        <p class="mb-4">Once upon a time, in a digital landscape vast and infinite, a connection was forged. It wasn't loud or boisterous; it was a quiet understanding, a signal found amidst the noise.</p>
                        <p class="mb-4">This book serves as a testament to the long roads we've walked, the hurdles we've jumped, and the silent nights that turned into bright mornings simply because we had each other.</p>
                        <p class="italic text-purple-300 text-center">"To love is to burn, to be on fire."</p>
                    </div>
                `
            },
            {
                color: "bg-orange-900",
                content: `
                    <div class="text-orange-100 text-center">
                        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300&h=300&fit=crop" class="w-32 h-32 rounded-full mx-auto mb-4 border-4 border-orange-500">
                        <h2 class="text-2xl font-bold mb-2 text-orange-200">Nyan Speed</h2>
                        <p class="text-xl font-bold mb-4">"Love Speed: 1000mph"</p>
                        <div class="text-2xl">🐱 💨 💨 💖</div>
                    </div>
                `
            },
            {
                color: "bg-teal-900",
                content: `
                    <div class="text-teal-100 text-center">
                        <h2 class="text-2xl font-bold mb-4 text-teal-200">The Entomology Shelf</h2>
                        <div class="flex justify-center gap-4 mb-6">
                            <div class="bg-teal-800 p-3 rounded">
                                <div class="text-2xl">🐞</div>
                                <div class="text-xs">Luck</div>
                            </div>
                            <div class="bg-teal-800 p-3 rounded">
                                <div class="text-2xl">🦋</div>
                                <div class="text-xs">Change</div>
                            </div>
                            <div class="bg-teal-800 p-3 rounded">
                                <div class="text-2xl">🐝</div>
                                <div class="text-xs">Work</div>
                            </div>
                        </div>
                        <p class="text-sm">"Even the smallest creatures carry the heaviest meanings."</p>
                    </div>
                `
            }
        ];

        function openBook(index) {
            const book = booksData[index];
            document.getElementById('modalBody').innerHTML = book.content;
            document.getElementById('modalContent').className = book.color + " max-w-2xl w-full rounded-xl p-8 relative text-white";
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // Close when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
